name: İmzalı taslak sürüm
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Sürüm ve anahtar hazırlığı
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]] || exit 1
          echo "APP_VERSION_NAME=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.p12" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: APK ve özet
        run: |
          cp app/build/outputs/apk/release/app-release.apk yerleske-menu.apk
          sha256sum yerleske-menu.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            yerleske-menu.apk
            SHA256SUMS.txt
      - name: Geçici sırları temizle
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.p12"
